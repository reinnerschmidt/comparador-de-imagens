[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comparador-de-imagens"
version = "0.1.0"
description = "Projeto inicial para comparação de imagens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "gunicorn>=21.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
